<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF ↔ HOMR 직접 음표 투영</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#1b1b1b;border-bottom:1px solid #444;padding:10px}h1{font-size:17px;margin:0 0 7px}.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}button,select{background:#292929;color:#eee;border:1px solid #555;border-radius:7px;padding:7px 10px;font-size:13px}.ctrl{font-size:12px;display:flex;gap:4px;align-items:center}input{width:95px}#status{font-size:12px;color:#bbb;margin-top:7px}.ok{color:#9fe39f}.warn{color:#ffcf66}main{padding:10px;overflow:auto}#frame{position:relative;margin:auto;background:#222}#pdf{position:absolute;left:0;top:0;width:100%;height:100%}#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}.measureBox{position:absolute;border:1px solid transparent;cursor:pointer}.selected{border-color:#4af!important}.measureBox.review{border-color:#ffb02055}.measureBox.close{border-color:#55aaff55}.measureBox.agree{border-color:#55dd7755}.measureBox.rhythm_review{border-color:#b77cff55}.measureBox.engine_disagreement,.measureBox.partial_engine_disagreement{border-color:#ff6b6b88}.measureBox.filtered{display:none}#info{position:fixed;right:12px;bottom:12px;max-width:430px;max-height:70vh;overflow:auto;background:#151515ee;border:1px solid #555;border-radius:8px;padding:10px;font-size:12px;z-index:20;box-shadow:0 4px 20px #000}.pill{display:inline-block;padding:2px 5px;border-radius:4px;margin-left:4px;border:1px solid #555}.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;margin-top:7px}.diag{margin-top:7px;padding:6px;border-radius:5px;background:#222}.diff{margin-top:5px}.note{stroke:#e22;fill:#f33;fill-opacity:.32}.nlabel{font:10px sans-serif;fill:#d22;font-weight:700}
</style></head><body><header><h1>🎼 PDF ↔ HOMR — 원본 좌표 직접 음표 투영</h1><div class="row"><button id="prev">◀</button><b id="page">1 / 2</b><button id="next">▶</button><select id="filter"><option value="all">전체 마디</option><option value="agree">AGREE</option><option value="rhythm_review">RHYTHM REVIEW</option><option value="close">CLOSE</option><option value="review">REVIEW</option><option value="engine_disagreement">ENGINE DISAGREEMENT</option></select><button id="notes">음표 표시</button></div><div class="row" style="margin-top:6px"><span class="ctrl">투명도 <input id="op" type="range" min="0" max="100" value="80"><b id="opv">80%</b></span><span class="ctrl">전체 X <input id="gx" type="range" min="-100" max="100" value="0"><b id="gxv">0</b></span><span class="ctrl">전체 Y <input id="gy" type="range" min="-100" max="100" value="0"><b id="gyv">0</b></span></div><div id="status">원본 PDF 좌표에 HOMR note event를 직접 투영합니다.</div></header><main><div id="frame"><img id="pdf"><svg id="ov"></svg></div><div id="info">마디를 클릭하면 비교 결과가 표시됩니다.</div></main><script>
/*__DATA__*/
/*__CMP__*/
let pi=0,showNotes=true;const $=x=>document.getElementById(x),F=$('filter');function pct(v){return v==null?'-':(v*100).toFixed(1)+'%'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function apply(){ $('opv').textContent=$('op').value+'%';$('gxv').textContent=$('gx').value;$('gyv').textContent=$('gy').value;$('ov').style.opacity=$('op').value/100 }
function draw(){const P=DATA[pi];$('page').textContent=(pi+1)+' / '+DATA.length;$('frame').style.width=P.w+'px';$('frame').style.height=P.h+'px';$('pdf').src=P.image;$('ov').innerHTML='';document.querySelectorAll('.measureBox').forEach(x=>x.remove());let total=0;
for(let i=0;i<P.measures.length;i++){const t=P.measures[i],key=`${pi+1}-${i+1}`,c=CMP[key]||{},cls=(c.status||'').toLowerCase();total+=t.notes.length;
 if(showNotes){const g=document.createElementNS('http://www.w3.org/2000/svg','g');for(let j=0;j<t.notes.length;j++){const n=t.notes[j];const x=n.x+Number($('gx').value),y=n.y+Number($('gy').value);const r=4;const cir=document.createElementNS('http://www.w3.org/2000/svg','circle');cir.setAttribute('cx',x);cir.setAttribute('cy',y);cir.setAttribute('r',r);cir.setAttribute('class','note');g.appendChild(cir);const l=document.createElementNS('http://www.w3.org/2000/svg','text');l.setAttribute('x',x+6);l.setAttribute('y',y-5);l.setAttribute('class','nlabel');l.textContent=`${j+1}`;g.appendChild(l)}$('ov').appendChild(g)}
 const b=document.createElement('div');b.className=`measureBox ${cls} ${c.diagnosis||''}`;b.dataset.status=c.status||'';b.dataset.diagnosis=c.diagnosis||'';b.style.cssText=`left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px`;b.onclick=()=>{$('info').innerHTML=`<b>${pi+1}페이지 ${i+1}마디</b> <span class="pill">${esc(c.status||'N/A')}</span><div class="diag">진단: <b>${esc(c.diagnosis||'N/A')}</b></div><div class="kv"><span>Exact</span><b>${pct(c.exact)}</b><span>Pitch</span><b>${pct(c.pitch)}</b><span>Pitch-content</span><b>${pct(c.pitch_content)}</b><span>Strict F1</span><b>${pct(c.strict_f1)}</b><span>Precision</span><b>${pct(c.strict_precision)}</b><span>Recall</span><b>${pct(c.strict_recall)}</b><span>HOMR / Audiveris</span><b>${c.homr_notes??'-'} / ${c.audiveris_notes??'-'}음</b><span>HOMR 투영</span><b>${t.notes.length}음</b></div>`};$('frame').appendChild(b)}
$('status').textContent=`페이지 ${pi+1}: ${P.measures.length}개 마디 · HOMR ${total}개 note 직접 투영`;$('status').className='ok';apply();filterApply()}
function filterApply(){document.querySelectorAll('.measureBox').forEach(b=>{const f=F.value,s=b.dataset.status||'',d=b.dataset.diagnosis||'';let h=false;if(f==='agree')h=s!=='AGREE';else if(f==='rhythm_review')h=s!=='RHYTHM_REVIEW';else if(f==='close')h=s!=='CLOSE';else if(f==='review')h=s!=='REVIEW';else if(f==='engine_disagreement')h=!d.includes('ENGINE_DISAGREEMENT');b.classList.toggle('filtered',h)})}
$('prev').onclick=()=>{if(pi){pi--;draw()}};$('next').onclick=()=>{if(pi<DATA.length-1){pi++;draw()}};$('notes').onclick=()=>{showNotes=!showNotes;$('notes').textContent=showNotes?'음표 숨김':'음표 표시';draw()};$('op').oninput=apply;$('gx').oninput=draw;$('gy').oninput=draw;F.onchange=filterApply;apply();draw();</script></body></html>
