name: OMR - HOMR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  omr:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install HOMR and MIDI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homr==0.7.0" music21

      - name: Render PDF to PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          mkdir -p work output

          pdf=$(find input -type f -iname '*.pdf' | head -n 1)
          test -n "$pdf" || { echo "PDF 없음"; exit 1; }

          pdftoppm -png -r 300 "$pdf" work/page

      - name: Run HOMR
        run: |
          set -e

          for img in work/page-*.png; do
            echo "=== Processing $img ==="
            python -m homr.main "$img"
          done

      - name: Post-process MusicXML
        run: |
          set -e
          mkdir -p output

          for xml in work/*.musicxml; do
            base=$(basename "$xml" .musicxml)

            python postprocess.py \
              "$xml" \
              "output/${base}_fixed.musicxml" \
              "output/${base}_diagnostics.txt"

            python - <<PY
from music21 import converter
src = "output/${base}_fixed.musicxml"
out = "output/${base}.mid"

score = converter.parse(src)
score.write("midi", fp=out)

print("MIDI:", out)
PY
          done

          cp work/*_teaser.png output/ 2>/dev/null || true

          echo "=== FINAL OUTPUT ==="
          ls -lh output

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: OMR-Final
          path: output/
          if-no-files-found: error
