name: OMR - HOMR + Verovio Overlay

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  omr:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install OMR and render tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homr==0.7.0" music21 "verovio==6.3.0"

      - name: Render PDF to PNG
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          mkdir -p work/300 output

          pdf=$(find input -type f -iname '*.pdf' | head -n 1)
          test -n "$pdf" || { echo "PDF 없음"; exit 1; }

          cp "$pdf" output/original.pdf
          pdftoppm -png -r 300 "$pdf" work/300/page

      - name: Run HOMR
        run: |
          set -e
          for img in work/300/page-*.png; do
            echo "=== Processing $img ==="
            python -m homr.main "$img"
          done

      - name: Post-process and MIDI
        run: |
          set -e
          mkdir -p output/musicxml output/midi diagnostics

          for xml in work/300/*.musicxml; do
            base=$(basename "$xml" .musicxml)

            python postprocess.py \
              "$xml" \
              "output/musicxml/${base}_fixed.musicxml" \
              "diagnostics/${base}.txt"

            python -c "from music21 import converter; s=converter.parse('output/musicxml/${base}_fixed.musicxml'); s.write('midi', fp='output/midi/${base}.mid')"
          done

      - name: Render MusicXML to SVG with Verovio
        run: |
          set -e
          mkdir -p output/svg

          for xml in output/musicxml/*_fixed.musicxml; do
            echo "=== Verovio: $xml ==="
            python render_verovio.py "$xml" output/svg
          done

          ls -lh output/svg

      - name: Build overlay viewer
        run: |
          cp overlay.html output/overlay.html

      - name: Upload final overlay bundle
        uses: actions/upload-artifact@v4
        with:
          name: OMR-Overlay-Viewer
          path: |
            output/
            diagnostics/
          if-no-files-found: error
