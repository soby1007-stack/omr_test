name: OMR - HOMR + Measure Overlay

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  omr:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install OMR and validation tools
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install "homr==0.7.0" music21 "verovio==6.3.0" pymupdf opencv-python-headless

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Render PDF and detect original layout
        run: |
          set -e
          mkdir -p work/300 work/pdf output
          pdf=$(find input -type f -iname '*.pdf' | head -n 1)
          test -n "$pdf" || { echo "PDF 없음"; exit 1; }
          cp "$pdf" output/original.pdf
          pdftoppm -png -r 300 "$pdf" work/300/page
          pdftoppm -png -r 144 "$pdf" work/pdf/page
          python detect_pdf_layout.py "$pdf" work/layout.json
          cat work/layout.json

      - name: Run HOMR
        run: |
          set -e
          for img in work/300/page-*.png; do
            echo "=== Processing $img ==="
            python -m homr.main --debug "$img"
          done


      - name: Collect HOMR attention/debug images
        run: |
          set -e
          mkdir -p output/attention
          find work/300 -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.png' \) -print -exec cp {} output/attention/ \;
          echo "=== Attention/debug files ==="
          find output/attention -type f -printf '%f %k KB\n' | sort

      - name: Post-process and MIDI
        run: |
          set -e
          mkdir -p output/musicxml output/midi diagnostics
          for xml in work/300/*.musicxml; do
            base=$(basename "$xml" .musicxml)
            python postprocess.py \
              "$xml" \
              "output/musicxml/${base}_fixed.musicxml" \
              "diagnostics/${base}.txt"
            python -c "from music21 import converter; s=converter.parse('output/musicxml/${base}_fixed.musicxml'); s.write('midi', fp='output/midi/${base}.mid')"
          done

      - name: Render each MusicXML separately with Verovio
        run: |
          set -e
          for xml in output/musicxml/page-*_fixed.musicxml; do
            base=$(basename "$xml" _fixed.musicxml)
            page_no=${base#page-}
            out="work/svg-source-${page_no}"
            rm -rf "$out"
            mkdir -p "$out"
            echo "=== Verovio: $xml -> $out ==="
            python render_verovio.py "$xml" "$out"
            find "$out" -type f -name '*.svg' -print
          done

      - name: Build automatic measure-level viewer
        run: |
          set -e
          python build_overlay.py work/layout.json work output/OMR_measure_overlay.html
          cp work/layout.json output/layout.json
          cp work/pdf/page-*.png output/
          cp -r work/svg-source-* output/

      - name: Source score auto verification
        run: |
          set -e
          mkdir -p output/autoverify

          for img in work/pdf/page-*.png; do
            base=$(basename "$img" .png)
            python omr_verify/auto_verify.py               "$img"               "output/autoverify/${base}.json"
          done

          echo "=== AUTO VERIFY RESULT ==="
          find output/autoverify -type f -maxdepth 1 -print

      - name: Upload final result
        uses: actions/upload-artifact@v4
        with:
          name: OMR-Measure-Overlay
          path: |
            output/
            diagnostics/
          if-no-files-found: error
