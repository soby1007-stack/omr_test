name: OMR - HOMR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  omr:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install HOMR
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homr==0.7.0"

      - name: Render PDF to PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          mkdir -p work output

          pdf=$(find input -type f -iname '*.pdf' | head -n 1)
          test -n "$pdf" || { echo "PDF 없음"; exit 1; }

          echo "=== PDF ==="
          echo "$pdf"

          pdftoppm -png -r 300 "$pdf" work/page

          echo "=== Rendered pages ==="
          ls -lh work/

      - name: Run HOMR
        run: |
          set -e

          for img in work/page-*.png; do
            echo "=== Processing $img ==="
            python -m homr.main "$img"
          done

          echo "=== Generated MusicXML ==="
          find work -type f -name '*.musicxml' -print

          find work -type f -name '*.musicxml' -exec cp {} output/ \;
          find work -type f -name '*_teaser.png' -exec cp {} output/ \;

          echo "=== Output ==="
          ls -lh output

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: OMR-MusicXML
          path: output/
          if-no-files-found: error
