name: OMR - HOMR + Measure Overlay

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  omr:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install OMR and validation tools
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install "homr==0.7.0" music21 "verovio==6.3.0" pymupdf opencv-python-headless

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Render PDF and detect original layout
        run: |
          set -e
          mkdir -p work/300 work/pdf output
          pdf=$(find input -type f -iname '*.pdf' | head -n 1)
          test -n "$pdf" || { echo "PDF 없음"; exit 1; }
          cp "$pdf" output/original.pdf
          pdftoppm -png -r 300 "$pdf" work/300/page
          pdftoppm -png -r 144 "$pdf" work/pdf/page
          python detect_pdf_layout.py "$pdf" work/layout.json
          cat work/layout.json

      - name: Run HOMR
        run: |
          set -e
          for img in work/300/page-*.png; do
            echo "=== Processing $img ==="
            python -m homr.main --debug "$img"
          done


      - name: Collect HOMR attention/debug images
        run: |
          set -e
          mkdir -p output/attention
          find work/300 -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.png' \) -print -exec cp {} output/attention/ \;
          echo "=== Attention/debug files ==="
          find output/attention -type f -printf '%f %k KB\n' | sort

      - name: Run Audiveris
        continue-on-error: true
        run: |
          set -e
          mkdir -p output/audiveris /tmp/audiveris-root

          wget -q \
            https://github.com/Audiveris/audiveris/releases/download/5.11.0/Audiveris-5.11.0-ubuntu24.04-x86_64.deb \
            -O /tmp/audiveris.deb

          rm -rf /tmp/audiveris-root
          dpkg-deb -x /tmp/audiveris.deb /tmp/audiveris-root

          AUDIVERIS=/tmp/audiveris-root/opt/audiveris/bin/Audiveris
          test -x "$AUDIVERIS"

          "$AUDIVERIS" -version

          pdf=$(find input -type f -iname '*.pdf' | head -n 1)
          test -n "$pdf"

          "$AUDIVERIS" \
            -batch \
            -transcribe \
            -export \
            -output output/audiveris \
            "$pdf"

          find output/audiveris -type f -print

      - name: Run SMT++ full-page OMR
        continue-on-error: true
        run: |
          set -e
          mkdir -p output/smt /tmp/crispembed /tmp/crispnotation

          wget -q \
            https://github.com/CrispStrobe/CrispEmbed/releases/download/v0.17.11/crispembed-linux-x86_64.tar.gz \
            -O /tmp/crispembed.tar.gz

          tar -xzf /tmp/crispembed.tar.gz -C /tmp/crispembed

          CRISP=$(find /tmp/crispembed -type f -name crispembed | head -n 1)
          LIB=$(find /tmp/crispembed -type f -name 'libcrispembed.so*' | head -n 1)

          test -n "$CRISP"
          test -n "$LIB"

          chmod +x "$CRISP"

          # crisp_notation CLI 설치
          python -m pip install dart-lang 2>/dev/null || true

          git clone --depth 1 \
            https://github.com/CrispStrobe/crisp_notation.git \
            /tmp/crispnotation

          if command -v dart >/dev/null 2>&1; then
            cd /tmp/crispnotation
            dart pub get
            dart pub global activate --source path packages/crisp_notation_cli
            cd -

            CRISP_NOTATION=$(find "$HOME/.pub-cache/bin" -maxdepth 1 -type f -name crisp_notation | head -n 1)

            if [ -n "$CRISP_NOTATION" ]; then
              export CRISPEMBED_LIB="$LIB"

              for img in work/300/page-*.png; do
                base=$(basename "$img" .png)

                echo "=== SMT++ -> MusicXML $img ==="

                "$CRISP_NOTATION" omr \
                  "$img" \
                  "output/smt/${base}.musicxml" \
                  --model smt-fp \
                  --lib "$LIB"

                test -s "output/smt/${base}.musicxml"
              done
            else
              echo "crisp_notation CLI binary not found"
              exit 1
            fi
          else
            echo "Dart SDK unavailable"
            exit 1
          fi

      - name: Post-process and MIDI
        run: |
          set -e
          mkdir -p output/musicxml output/midi diagnostics

          for xml in work/300/*.musicxml; do
            base=$(basename "$xml" .musicxml)

            python postprocess.py \
              "$xml" \
              "output/musicxml/${base}_fixed.musicxml" \
              "diagnostics/${base}.txt"

            python -c "from music21 import converter; s=converter.parse('output/musicxml/${base}_fixed.musicxml'); s.write('midi', fp='output/midi/${base}.mid')"
          done

      - name: Compare OMR engines
        run: |
          set -e
          mkdir -p output/comparison

          python -c 'import json,xml.etree.ElementTree as ET; from pathlib import Path; sources={"homr":sorted(Path("output/musicxml").glob("*_fixed.musicxml")),"audiveris":sorted(Path("output/audiveris").glob("*.mxl")),"smt":sorted(Path("output/smt").glob("*.musicxml"))}; report={k:[{"file":str(f),"notes":sum(1 for n in ET.parse(f).getroot().iter("note") if n.find("pitch") is not None)} for f in v] for k,v in sources.items()}; Path("output/comparison/engine_summary.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)); print(json.dumps(report,ensure_ascii=False,indent=2))'

      - name: Render each MusicXML separately with Verovio
        run: |
          set -e
          for xml in output/musicxml/page-*_fixed.musicxml; do
            base=$(basename "$xml" _fixed.musicxml)
            page_no=${base#page-}
            out="work/svg-source-${page_no}"
            rm -rf "$out"
            mkdir -p "$out"
            echo "=== Verovio: $xml -> $out ==="
            python render_verovio.py "$xml" "$out"
            find "$out" -type f -name '*.svg' -print
          done

      - name: Build automatic measure-level viewer
        run: |
          set -e
          python build_overlay.py work/layout.json work output/OMR_measure_overlay.html
          cp work/layout.json output/layout.json
          cp work/pdf/page-*.png output/
          cp -r work/svg-source-* output/

      - name: Source score auto verification
        run: |
          set -e
          mkdir -p output/autoverify

          for img in work/pdf/page-*.png; do
            base=$(basename "$img" .png)
            python omr_verify/auto_verify.py               "$img"               "output/autoverify/${base}.json"
          done

          echo "=== AUTO VERIFY RESULT ==="
          find output/autoverify -type f -maxdepth 1 -print

      - name: Source notehead verification v2
        run: |
          set -e
          mkdir -p output/autoverify-v2

          for img in work/pdf/page-*.png; do
            base=$(basename "$img" .png)
            python omr_verify/auto_verify_v2.py \
              "$img" \
              "output/autoverify-v2/${base}.json"
          done

          python omr_verify/build_report.py \
            output/autoverify-v2 \
            output/autoverify-v2/report.json

          cat output/autoverify-v2/report.json

      - name: Upload final result
        uses: actions/upload-artifact@v4
        with:
          name: OMR-Measure-Overlay
          path: |
            output/
            diagnostics/
          if-no-files-found: error
